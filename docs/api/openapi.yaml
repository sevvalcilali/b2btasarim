openapi: 3.1.0
info:
  title: N Kolay Bayim B2B Panel API
  version: 0.1.0
  description: |
    Panel ekranlarının kullandığı uç noktalar. Ekranlar bu sözleşmeye göre yazılmıştır; sahte backend (mocks/)
    aynı sözleşmeye göre cevap verir. Backend servisleri bu dosyaya göre yazılınca ekran kodu değişmeden bağlanır.

    Genel kurallar
    - Alan adları camelCase; durum ve tür değerleri kod (ör. BASARILI, ALT_BAYI). Ekran etiketleri: lib/etiketler.js
    - Para: kuruş cinsinden tam sayı (tutarKurus: 1240000 = ₺ 12.400,00)
    - Tarih: ISO 8601, saat dilimli (2026-09-30T14:22:00+03:00); yalnız gün için YYYY-AA-GG
    - Liste cevabı: { kayitlar, toplam, sayfa, boyut, sayaclar? }; filtre ve arama sorgu parametresiyle, sunucuda
    - Hata: { hata: { kod, mesaj, alanlar? } } + HTTP durumu (400 biçim, 401 oturum yok, 403 yetki yok,
      404 yok, 409 çakışma, 422 iş kuralı, 500 sunucu)
    - Kimlik: Authorization: Bearer <token>; rol ve firma tokendan çıkarılır, istemci göndermez
    - Rol kapsamı (şartname s.7): ana firma tüm ağı, bayi kendisi + alt bayileri, alt bayi yalnızca kendisi görür.
      Kapsam dışı kayıt listelerde yer almaz, tekil istekte 404 döner.

    Backend ekibinin netleştireceği noktalar
    - Kimlik doğrulama: token nasıl alınır, klasik panelle ortak oturum (şartname s.10)
    - Ödeme: kart numarası yerine kart tokenı (PCI); tokenı hangi sağlayıcı / 3D Secure akışı üretir
    - Vade farkı formülü: sunucu /odeme/taksit-secenekleri ile hesaplar; mockup varsayımı tutar × oran × (taksit − 1)
servers:
  - url: /api/v1
    description: Sahte backend (MSW) — geliştirme ve demo
security:
  - bearer: []
tags:
  - name: Oturum
  - name: Panel
  - name: İşlemler
  - name: Ödeme
  - name: İptal / İade
  - name: Bayi Tanım
  - name: Fatura
  - name: Tanımlar
  - name: Duyuru

paths:
  /oturum:
    get:
      tags: [Oturum]
      summary: Giriş yapmış kullanıcı, rolü, firması ve yetkileri
      responses:
        "200":
          description: Oturum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Oturum" }
              example:
                kullanici: { kullaniciId: K-101, adSoyad: Murat Aydın, email: murat@ankaralastik.com, yetki: YONETICI }
                rol: BAYI
                firma:
                  firmaId: "320.01.001"
                  unvan: Ankara Lastik Bayi Ltd.
                  tur: BAYI
                  cariNo: "320.01.001"
                  vergiNo: "1234567890"
                  logoRenk: "#C2630F"
                  bagli: { firmaId: "100.00.001", unvan: Brisa A.Ş., tur: ANA_FIRMA }
                anaFirma: { firmaId: "100.00.001", unvan: Brisa A.Ş., kisaAd: Brisa, aciklama: Lastik & Otomotiv Bayi Ağı, logoRenk: "#4F9B7C" }
                yetkiler: [ODEME, RAPOR, IPTAL_IADE_GIRIS, IPTAL_IADE_ONAY, BAYI_TANIM, KULLANICI_TANIM, AYARLAR]
        "401": { $ref: "#/components/responses/OturumYok" }

  /islemler:
    get:
      tags: [İşlemler]
      summary: İşlem listesi (rapor ve Son İşlemler)
      description: |
        Rol kapsamındaki ödeme işlemleri, en yeniden eskiye. Filtre, arama ve sayfalama sunucuda.
        `sayaclar` durum sekmelerinin sayılarıdır ve durum dışındaki filtrelere göre hesaplanır;
        `ozet` filtreye uyan tüm kayıtların (sayfadan bağımsız) toplamıdır.
      parameters:
        - { name: durum, in: query, schema: { $ref: "#/components/schemas/IslemDurumu" } }
        - { name: musteriTuru, in: query, schema: { $ref: "#/components/schemas/MusteriTuru" } }
        - { name: odemeTipi, in: query, schema: { type: string, enum: [MANUEL, LINK] } }
        - { name: q, in: query, schema: { type: string }, description: İşlem no, unvan, cari no, vergi no, kart son 4 hane, çekim yapan unvanı }
        - { name: sayfa, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: boyut, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Sayfalı işlem listesi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Liste"
                  - type: object
                    required: [sayaclar, ozet, musteriTurleri]
                    properties:
                      kayitlar: { type: array, items: { $ref: "#/components/schemas/Islem" } }
                      ozet:
                        type: object
                        properties:
                          toplamKurus: { $ref: "#/components/schemas/Kurus" }
                          basariliKurus: { $ref: "#/components/schemas/Kurus" }
                      musteriTurleri:
                        type: array
                        items: { $ref: "#/components/schemas/MusteriTuru" }
                        description: Kapsamda görülen müşteri türleri (filtre seçenekleri)
              example:
                kayitlar:
                  - islemNo: TRX-90241
                    tarih: "2026-09-30T14:22:00+03:00"
                    cekimYapan: { firmaId: "320.01.001", unvan: Ankara Lastik Bayi Ltd., tur: BAYI }
                    musteriTuru: DUZENLI_MUSTERI
                    musteri: { unvan: Yılmaz Otomotiv, cariNo: "120.01.045", vergiNo: "4820193746" }
                    kart: { son4: "4821" }
                    odemeTipi: MANUEL
                    taksit: 3
                    tutarKurus: 1240000
                    durum: BASARILI
                toplam: 14
                sayfa: 1
                boyut: 50
                sayaclar: { TUMU: 22, BASARILI: 14, BASARISIZ: 3, IPTAL: 3, IADE: 2 }
                ozet: { toplamKurus: 24587000, basariliKurus: 21000000 }
                musteriTurleri: [BAYI, ALT_BAYI, DUZENLI_MUSTERI, DUZENSIZ_MUSTERI, KENDI_KARTI]
        "401": { $ref: "#/components/responses/OturumYok" }

  /panel/ozet:
    get:
      tags: [Panel]
      summary: Ana Sayfa KPI özeti
      description: Kalem başına adet, tutar ve düne göre değişim; başarı oranı; ortalama işlem; mini seriler. Rol kapsamına göre hesaplanır.
      parameters:
        - { name: donem, in: query, schema: { type: string, enum: [bugun, hafta, ay], default: bugun } }
      responses:
        "200":
          description: KPI özeti
          content:
            application/json:
              schema:
                type: object
                required: [donem, kalemler, basariOraniYuzde, ortalamaIslemKurus]
                properties:
                  donem: { type: string }
                  kalemler:
                    type: object
                    description: TOPLAM, BASARILI, BASARISIZ, IPTAL, IADE anahtarları
                    additionalProperties:
                      type: object
                      properties:
                        adet: { type: integer }
                        tutarKurus: { $ref: "#/components/schemas/Kurus" }
                        degisimYuzde: { type: number, description: Düne göre yüzde değişim, işaretli }
                  basariOraniYuzde: { type: number }
                  ortalamaIslemKurus: { $ref: "#/components/schemas/Kurus" }
                  seriler:
                    type: object
                    description: Kart içi mini grafik için 7 noktalı seriler (TOPLAM, BASARILI); birimsiz
                    additionalProperties: { type: array, items: { type: number } }
              example:
                donem: bugun
                kalemler:
                  TOPLAM: { adet: 1284, tutarKurus: 428490000, degisimYuzde: 6.4 }
                  BASARILI: { adet: 1180, tutarKurus: 396010000, degisimYuzde: 7.1 }
                  BASARISIZ: { adet: 74, tutarKurus: 21040000, degisimYuzde: -2.3 }
                  IPTAL: { adet: 18, tutarKurus: 6420000, degisimYuzde: 0.8 }
                  IADE: { adet: 12, tutarKurus: 5020000, degisimYuzde: -1.2 }
                basariOraniYuzde: 91.9
                ortalamaIslemKurus: 333715
                seriler: { TOPLAM: [44, 50, 49, 57, 61, 66, 72], BASARILI: [40, 52, 47, 60, 58, 71, 76] }
        "401": { $ref: "#/components/responses/OturumYok" }

  /panel/haftalik-hacim:
    get:
      tags: [Panel]
      summary: Son 7 günün günlük işlem hacmi
      responses:
        "200":
          description: Günlük hacim
          content:
            application/json:
              schema:
                type: object
                required: [gunler, toplamKurus, degisimYuzde]
                properties:
                  gunler:
                    type: array
                    items:
                      type: object
                      properties:
                        gun: { type: string, format: date }
                        tutarKurus: { $ref: "#/components/schemas/Kurus" }
                  toplamKurus: { $ref: "#/components/schemas/Kurus" }
                  degisimYuzde: { type: number, description: Geçen haftaya göre, işaretli }
              example:
                gunler: [{ gun: "2026-09-28", tutarKurus: 51200000 }, { gun: "2026-09-29", tutarKurus: 64400000 }]
                toplamKurus: 374000000
                degisimYuzde: 12.4
        "401": { $ref: "#/components/responses/OturumYok" }

  /panel/bakiye:
    get:
      tags: [Panel]
      summary: Bakiye ve borç
      description: Ana firma kendi limitini, bayi ana firma carisini, alt bayi bayi carisini görür (şartname s.2).
      responses:
        "200":
          description: Bakiye
          content:
            application/json:
              schema:
                type: object
                required: [bakiyeKurus, borcKurus, limitKurus, kullanimYuzde, gorunum]
                properties:
                  bakiyeKurus: { $ref: "#/components/schemas/Kurus" }
                  borcKurus: { $ref: "#/components/schemas/Kurus" }
                  limitKurus: { $ref: "#/components/schemas/Kurus" }
                  kullanimYuzde: { type: number }
                  gorunum: { type: string, enum: [FIRMA_LIMITI, UST_CARI] }
              example: { bakiyeKurus: 18420000, borcKurus: 4650000, limitKurus: 40000000, kullanimYuzde: 46, gorunum: UST_CARI }
        "401": { $ref: "#/components/responses/OturumYok" }

  /duyurular:
    get:
      tags: [Duyuru]
      summary: Duyurular (şartname s.2)
      description: Ana firma tüm duyuruları okunma sayısıyla görür; bayi / alt bayi yalnız yayında olup rolüne hedeflenenleri, kendi okundu bilgisiyle görür.
      responses:
        "200":
          description: Duyurular
          content:
            application/json:
              schema:
                type: object
                properties:
                  kayitlar:
                    type: array
                    items: { $ref: "#/components/schemas/Duyuru" }
                  duzenlenebilir: { type: boolean, description: Ana firma Yöneticisi }
    post:
      tags: [Duyuru]
      summary: Yeni duyuru (ana firma Yöneticisi)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuyuruGirdisi" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Duyuru" }
        "403": { $ref: "#/components/responses/YetkiYok" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /duyurular/{duyuruId}:
    put:
      tags: [Duyuru]
      summary: Duyuruyu güncelle / arşivle (ana firma Yöneticisi)
      parameters:
        - { name: duyuruId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuyuruGirdisi" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Duyuru" }
        "403": { $ref: "#/components/responses/YetkiYok" }
        "404": { $ref: "#/components/responses/Bulunamadi" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /duyurular/{duyuruId}/okundu:
    post:
      tags: [Duyuru]
      summary: Oturumdaki kullanıcı duyuruyu okudu (pop-up kapatıldı)
      parameters:
        - { name: duyuruId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Kaydedildi }
        "404": { $ref: "#/components/responses/Bulunamadi" }

  /kurlar:
    get:
      tags: [Panel]
      summary: USD / Euro kur bilgisi (şartname s.2)
      description: Bilgilendirme amaçlı gösterge kurları; tahsilat TL yapılır. Kaynak ve güncelleme sıklığını backend belirler.
      responses:
        "200":
          description: Kurlar
          content:
            application/json:
              schema:
                type: object
                properties:
                  kayitlar:
                    type: array
                    items: { $ref: "#/components/schemas/Kur" }
                  guncelleme: { type: string, format: date-time }
                  kaynak: { type: string, example: TCMB gösterge }

  /bakiye/ekstre:
    get:
      tags: [Panel]
      summary: Üst cari karşısındaki bakiye, borç ve hareketler (şartname s.2 — Ana Firma / Bayi Bakiye ve Borç)
      description: Bayi ana firma carisini, alt bayi bayi carisini görür; ana firmanın üst carisi yoktur (403). Hareketler borç yüklemeleri ve bu firmanın yaptığı ödemelerden oluşur.
      parameters:
        - { name: donem, in: query, schema: { type: string, enum: [30g, 90g, tumu], default: 30g } }
      responses:
        "200":
          description: Ekstre
          content:
            application/json:
              schema:
                type: object
                properties:
                  ustCari: { $ref: "#/components/schemas/FirmaOzeti" }
                  bakiyeKurus: { $ref: "#/components/schemas/Kurus" }
                  borcKurus: { $ref: "#/components/schemas/Kurus" }
                  limitKurus: { $ref: "#/components/schemas/Kurus" }
                  kullanimYuzde: { type: number }
                  sonGuncelleme: { type: string, format: date-time }
                  donem: { type: string }
                  hareketler:
                    type: array
                    items: { $ref: "#/components/schemas/BakiyeHareketi" }
                  donemToplami:
                    type: object
                    description: Dönemdeki hareketlerin tür bazında toplamı
                    properties:
                      borcKurus: { $ref: "#/components/schemas/Kurus" }
                      odemeKurus: { $ref: "#/components/schemas/Kurus" }
                      iadeIptalKurus: { $ref: "#/components/schemas/Kurus" }
        "403": { $ref: "#/components/responses/YetkiYok" }

  /bayiler:
    get:
      tags: [Bayi Tanım]
      summary: Bayi / alt bayi listesi
      description: |
        Ana firma `tur=BAYI` ile bayilerini, `tur=ALT_BAYI` ile ağdaki tüm alt bayileri (salt okunur) görür;
        bayi yalnızca kendi alt bayilerini görür (`tur` yoksayılır); alt bayinin bayi tanımı yoktur (403).
      parameters:
        - { name: tur, in: query, schema: { type: string, enum: [BAYI, ALT_BAYI] } }
        - { name: durum, in: query, schema: { $ref: "#/components/schemas/KayitDurumu" } }
        - { name: q, in: query, schema: { type: string }, description: Unvan, cari no, vergi no }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Liste"
                  - type: object
                    properties:
                      kayitlar: { type: array, items: { $ref: "#/components/schemas/Bayi" } }
                      duzenlenebilir: { type: boolean, description: Oturum bu listedeki kayıtları düzenleyebilir mi }
        "401": { $ref: "#/components/responses/OturumYok" }
        "403": { $ref: "#/components/responses/YetkiYok" }
    post:
      tags: [Bayi Tanım]
      summary: Bayi (ana firma) ya da alt bayi (yetkili bayi) tanımla
      description: |
        Şartname s.5. Alt bayiye verilen taksitler, üye işyerleri ve işlem limiti tanımlayan bayinin kendi
        sınırlarını aşamaz (422). Cari no ağda tek olmalıdır (409). Yetkisiz rol 403 alır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BayiGirdisi" }
            example:
              tur: BAYI
              unvan: Eskişehir Lastik Market
              cariNo: "320.01.006"
              vergiNo: "6789012345"
              telefon: 0222 444 10 10
              email: info@eskisehirlastik.com
              adres: Organize Sanayi Bölgesi No:5 Eskişehir
              vadeProfilId: 1
              taksitler: [1, 2, 3, 6]
              islemLimitiKurus: 9000000
              altBayiYetkisi: false
              uyeIsyerleri: ["320.00.001", "320.00.002"]
              durum: AKTIF
      responses:
        "201":
          description: Oluşturulan kayıt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bayi" }
        "403": { $ref: "#/components/responses/YetkiYok" }
        "409":
          description: Cari no başka bir kayıtta kullanılıyor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HataCevabi" }
              example: { hata: { kod: CARI_CAKISMASI, mesaj: Bu cari no başka bir kayıtta kullanılıyor., alanlar: { cariNo: Bu cari no başka bir kayıtta kullanılıyor. } } }
        "422": { $ref: "#/components/responses/IsKurali" }

  /bayiler/{cariNo}:
    parameters:
      - { name: cariNo, in: path, required: true, schema: { type: string } }
    get:
      tags: [Bayi Tanım]
      summary: Tek bayi / alt bayi (düzenleme için)
      responses:
        "200":
          description: Kayıt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bayi" }
        "404": { $ref: "#/components/responses/Bulunamadi" }
    put:
      tags: [Bayi Tanım]
      summary: Bayi / alt bayi güncelle (cari no değişmez)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BayiGirdisi" }
      responses:
        "200":
          description: Güncel kayıt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bayi" }
        "404": { $ref: "#/components/responses/Bulunamadi" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /firma:
    get:
      tags: [Tanımlar]
      summary: Oturum firmasının kendi kaydı
      description: Taksit sınırı, işlem limiti, vade profili, üye işyerleri, alt bayi yetkisi, ortaklar — alt bayi tanımında ve ödemede üst sınır olarak kullanılır.
      responses:
        "200":
          description: Firma
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bayi" }

  /firma/iletisim:
    put:
      tags: [Tanımlar]
      summary: Kendi iletişim bilgisini güncelle (bayi / alt bayi, yalnız Yönetici)
      description: Şartname s.10 Firma Bilgileri. Unvan, cari / vergi no ve ödeme koşulları üst firmanın bayi tanımında kalır. Ana firma için 403 (klasik panel).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [telefon, email, adres]
              properties:
                telefon: { type: string }
                email: { type: string, format: email }
                adres: { type: string }
      responses:
        "200":
          description: Güncel firma kaydı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bayi" }
        "403": { $ref: "#/components/responses/YetkiYok" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /kullanicilar:
    get:
      tags: [Tanımlar]
      summary: Firmanın kullanıcıları (şartname s.3)
      description: Her rol yalnız kendi firmasının kullanıcılarını görür. duzenlenebilir = oturumdaki kullanıcı Yönetici.
      parameters:
        - { name: durum, in: query, schema: { $ref: "#/components/schemas/KayitDurumu" } }
        - { name: q, in: query, schema: { type: string }, description: Ad soyad ya da e-posta }
      responses:
        "200":
          description: Kullanıcılar
          content:
            application/json:
              schema:
                type: object
                properties:
                  kayitlar:
                    type: array
                    items: { $ref: "#/components/schemas/Kullanici" }
                  toplam: { type: integer }
                  sayaclar: { type: object, properties: { TUMU: { type: integer }, AKTIF: { type: integer }, PASIF: { type: integer } } }
                  duzenlenebilir: { type: boolean }
    post:
      tags: [Tanımlar]
      summary: Yeni kullanıcı (yalnız Yönetici)
      description: Şifre belirleme / davet e-postasını backend gönderir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KullaniciGirdisi" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kullanici" }
        "403": { $ref: "#/components/responses/YetkiYok" }
        "409":
          description: EPOSTA_CAKISMASI — e-posta başka bir kullanıcıda
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HataCevabi" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /kullanicilar/{kullaniciId}:
    put:
      tags: [Tanımlar]
      summary: Kullanıcıyı güncelle (yalnız Yönetici)
      description: Kullanıcı kendi yetkisini ve durumunu değiştiremez (422, alanlar.yetki / alanlar.durum); düzenleyen hep aktif bir Yönetici olduğundan firma yöneticisiz kalmaz.
      parameters:
        - { name: kullaniciId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KullaniciGirdisi" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kullanici" }
        "403": { $ref: "#/components/responses/YetkiYok" }
        "404": { $ref: "#/components/responses/Bulunamadi" }
        "409":
          description: EPOSTA_CAKISMASI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HataCevabi" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /vade-farki-profilleri:
    get:
      tags: [Tanımlar]
      summary: Vade farkı profilleri (şartname s.4, en çok 5)
      description: Tüm roller okur (bayi tanımında seçilir). Kullanan bayi sayısı ve örnek hesap sunucuda hesaplanır.
      responses:
        "200":
          description: Profiller
          content:
            application/json:
              schema:
                type: object
                properties:
                  kayitlar:
                    type: array
                    items: { $ref: "#/components/schemas/VadeFarkiProfili" }
                  sinir: { type: integer, example: 5, description: En çok kaç profil tanımlanabilir }
    post:
      tags: [Tanımlar]
      summary: Yeni vade farkı profili (yalnız ana firma)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VadeFarkiProfiliGirdisi" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VadeFarkiProfili" }
        "403": { $ref: "#/components/responses/YetkiYok" }
        "422":
          description: PROFIL_SINIRI (sınır dolu) ya da DOGRULAMA (ad boş / çakışıyor, oran %0–10 dışında)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HataCevabi" }

  /vade-farki-profilleri/{id}:
    put:
      tags: [Tanımlar]
      summary: Vade farkı profilini güncelle (yalnız ana firma)
      description: Aktif bir bayinin kullandığı profil pasife alınamaz (422, alanlar.durum). Oran değişikliği sonraki ödemelere yansır.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VadeFarkiProfiliGirdisi" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VadeFarkiProfili" }
        "403": { $ref: "#/components/responses/YetkiYok" }
        "404": { $ref: "#/components/responses/Bulunamadi" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /uye-isyerleri:
    get:
      tags: [Tanımlar]
      summary: Ana firmanın üye işyerleri (bayi / alt bayi yalnızca kendisine açılanları görür)
      responses:
        "200":
          description: Üye işyerleri
          content:
            application/json:
              schema:
                type: object
                properties:
                  kayitlar:
                    type: array
                    items:
                      type: object
                      properties:
                        cariNo: { type: string, example: "320.00.001" }
                        ad: { type: string, example: Brisa İş Makinası Lastik }

  /musteriler:
    get:
      tags: [Ödeme]
      summary: Oturum firmasının tanımlı (düzenli) müşterileri
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Unvan, cari no, vergi no }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Liste"
                  - type: object
                    properties:
                      kayitlar: { type: array, items: { $ref: "#/components/schemas/Musteri" } }
    post:
      tags: [Bayi Tanım]
      summary: Düzenli müşteri tanımla (bayi tanım ekranında "Müşteri" türü)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KimlikGirdisi" }
      responses:
        "201":
          description: Oluşturulan müşteri
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Musteri" }
        "409": { $ref: "#/components/responses/IsKurali" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /tahsilat-carileri:
    get:
      tags: [Ödeme]
      summary: Ödemenin aktarılacağı cariler
      description: Ana firma üye işyerlerini, bayi kendisine açık üye işyerlerini, alt bayi bağlı olduğu bayinin carisini görür (şartname s.2, s.6).
      responses:
        "200":
          description: Cariler
          content:
            application/json:
              schema:
                type: object
                properties:
                  etiket: { type: string, example: Ana Firma Carisi, description: Ekranda alanın başlığı }
                  kayitlar:
                    type: array
                    items:
                      type: object
                      properties:
                        cariNo: { type: string }
                        ad: { type: string }

  /odeme/taksit-secenekleri:
    get:
      tags: [Ödeme]
      summary: Taksit seçenekleri ve vade farkı
      description: |
        Taksitler ve işlem limiti oturum firmasının tanımından; vade profili firmanın kendi profili, ana firma bir
        bayiden tahsilat yapıyorsa o bayinin profili, aksi halde Profil 1 (şartname s.4–5). Hesap sunucuda yapılır;
        formül backend ekibince netleştirilecek (mockup varsayımı: tutar × aylık oran × (taksit − 1)).
      parameters:
        - { name: musteriTuru, in: query, required: true, schema: { $ref: "#/components/schemas/MusteriTuru" } }
        - { name: musteriCariNo, in: query, schema: { type: string } }
        - { name: tutarKurus, in: query, schema: { $ref: "#/components/schemas/Kurus" }, description: Boşsa seçenekler tutarsız döner }
      responses:
        "200":
          description: Seçenekler
          content:
            application/json:
              schema:
                type: object
                properties:
                  vadeProfil: { $ref: "#/components/schemas/VadeFarkiProfili" }
                  limitKurus: { oneOf: [{ $ref: "#/components/schemas/Kurus" }, { type: "null" }], description: İşlem bazlı ödeme limiti; ana firmada yok }
                  taksitler: { type: array, items: { type: integer } }
                  secenekler:
                    type: array
                    items: { $ref: "#/components/schemas/TaksitSecenegi" }
              example:
                vadeProfil: { id: 2, ad: Vade Farkı Profil 2, oranYuzde: 2.45 }
                limitKurus: 15000000
                taksitler: [1, 2, 3, 6, 9]
                secenekler:
                  - { taksit: 1, vadeFarkiKurus: 0, toplamKurus: 1200000, aylikKurus: 1200000 }
                  - { taksit: 6, vadeFarkiKurus: 147000, toplamKurus: 1347000, aylikKurus: 224500 }

  /odemeler:
    post:
      tags: [Ödeme]
      summary: Manuel ödeme al
      description: |
        Şartname s.6 ve s.9. Kart numarası isteğe yazılmaz: istemci kartı ödeme sağlayıcısında tokenlaştırır ve
        yalnızca `kart.token` gönderir (PCI). `Idempotency-Key` başlığı aynı isteğin ikinci gönderiminde ilk cevabı
        döndürür. Doğrulama hataları 422 ile alan alan gelir. Demo: son 4 hanesi 0002 olan kart BASARISIZ döner.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OdemeGirdisi" }
            example:
              musteriTuru: DUZENLI_MUSTERI
              musteri: { cariNo: "120.01.045" }
              tahsilatCariNo: "320.00.001"
              tutarKurus: 1200000
              taksit: 6
              aciklama: Eylül faturası
              kart: { token: tok_demo_4821_x7k2p9, son4: "4821", isim: Ahmet Yıldız }
              faturaBeyani: true
      responses:
        "201":
          description: İşlem sonucu (BASARILI ya da BASARISIZ)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OdemeSonucu" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /odeme-linkleri:
    get:
      tags: [Ödeme]
      summary: Ödeme linkleri (rol kapsamında, en yeniden eskiye)
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Liste"
                  - type: object
                    properties:
                      kayitlar: { type: array, items: { $ref: "#/components/schemas/OdemeLinki" } }
    post:
      tags: [Ödeme]
      summary: Ödeme linki oluştur ve gönder
      description: Müşteri seçimi manuel ödemeyle aynı yapıda (şartname s.6). Müşteriye yalnızca `taksitler` listesindeki taksitler gösterilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OdemeLinkiGirdisi" }
      responses:
        "201":
          description: Oluşturulan link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OdemeLinki" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /panel/bekleyenler:
    get:
      tags: [Panel]
      summary: Menü rozetleri
      responses:
        "200":
          description: Bekleyen iş sayıları
          content:
            application/json:
              schema:
                type: object
                properties:
                  onayBekleyenTalep: { type: integer, description: Oturumun onayını bekleyen iptal / iade talebi }
                  faturasiBekleyenIslem: { type: integer, description: Oturum firmasının faturası yüklenmemiş işlemi }
                  okunmamisDuyuru: { type: integer, description: Oturumdaki kullanıcının okumadığı yayındaki duyuru }
              example: { onayBekleyenTalep: 3, faturasiBekleyenIslem: 0, okunmamisDuyuru: 1 }

  /iptal-iade-talepleri:
    get:
      tags: [İptal / İade]
      summary: İptal / iade talepleri (takip raporu ve onay listesi)
      description: |
        Rol kapsamındaki talepler. `gorunum` sekmeyi seçer; `sayaclar` her görünümün sayısını verir. Onay ekranı
        `gorunum=ONAYIMDA` kullanır. Her kayıtta `onayimda` oturumun onay / red verebileceğini söyler (şartname s.7–8).
      parameters:
        - { name: gorunum, in: query, schema: { type: string, enum: [TUMU, ONAYIMDA, UST_ONAYA_ILETILEN, ONAY_BEKLEYEN, ONAYLANDI, REDDEDILDI], default: TUMU } }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Liste"
                  - type: object
                    properties:
                      kayitlar: { type: array, items: { $ref: "#/components/schemas/Talep" } }
    post:
      tags: [İptal / İade]
      summary: Talep gir
      description: |
        Şartname s.8. Alt bayinin talebi BAYI_ONAYINDA, bayinin talebi ANA_FIRMA_ONAYINDA başlar; ana firmanın kendi
        talebi onay gerektirmeden ONAYLANDI olur ve işlem durumu değişir. İPTAL işlemin tamamı içindir; İADE kısmi olabilir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [islemNo, tur, tutarKurus, aciklama]
              properties:
                islemNo: { type: string }
                tur: { type: string, enum: [IADE, IPTAL] }
                tutarKurus: { $ref: "#/components/schemas/Kurus" }
                aciklama: { type: string }
      responses:
        "201":
          description: Oluşturulan talep
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Talep" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /iptal-iade-talepleri/uygun-islemler:
    get:
      tags: [İptal / İade]
      summary: Talep girilebilecek işlemler (kendi başarılı çekimleri, açık / onaylı talebi olmayanlar)
      responses:
        "200":
          description: İşlemler
          content:
            application/json:
              schema:
                type: object
                properties:
                  kayitlar:
                    type: array
                    items:
                      type: object
                      properties:
                        islemNo: { type: string }
                        tarih: { type: string, format: date-time }
                        musteriUnvan: { type: string }
                        tutarKurus: { $ref: "#/components/schemas/Kurus" }

  /iptal-iade-talepleri/{talepNo}/onay:
    post:
      tags: [İptal / İade]
      summary: Onayla
      description: Bayi onaylarsa talep ana firma onayına iletilir; ana firma onaylarsa sonuçlanır ve işlem durumu değişir. Talebi giren e-posta ile bilgilendirilir.
      parameters:
        - { name: talepNo, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Güncel talep (+ bildirim metni)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Talep"
                  - type: object
                    properties:
                      bildirim: { type: string }
        "403": { $ref: "#/components/responses/YetkiYok" }
        "404": { $ref: "#/components/responses/Bulunamadi" }

  /iptal-iade-talepleri/{talepNo}/red:
    post:
      tags: [İptal / İade]
      summary: Reddet (gerekçe zorunlu)
      parameters:
        - { name: talepNo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gerekce]
              properties:
                gerekce: { type: string }
      responses:
        "200":
          description: Güncel talep (+ bildirim metni)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Talep" }
        "403": { $ref: "#/components/responses/YetkiYok" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /raporlar/bayi-ozet:
    get:
      tags: [İşlemler]
      summary: Bayi / alt bayi özet raporu (şartname s.7)
      description: |
        Firma başına işlem adedi, başarılı ciro, vade farkı, iptal/iade ve hesaba geçecek tutar. Ana firma tüm bayi ve
        alt bayileri, bayi kendisini ve alt bayilerini görür; alt bayinin özet raporu yoktur (403).
        Hesaba geçecek = başarılı ciro + vade farkı − iptal/iade — DEMO VARSAYIMI, kesin hesabı backend belirler.
      parameters:
        - { name: donem, in: query, schema: { type: string, enum: [7g, 30g, tumu], default: 30g } }
        - { name: musteriTuru, in: query, schema: { $ref: "#/components/schemas/MusteriTuru" } }
      responses:
        "200":
          description: Özet
          content:
            application/json:
              schema:
                type: object
                properties:
                  donem: { type: string }
                  kayitlar:
                    type: array
                    items: { $ref: "#/components/schemas/BayiOzetSatiri" }
                  toplam:
                    allOf:
                      - $ref: "#/components/schemas/OzetRakamlari"
                      - type: object
                        properties:
                          firmaAdet: { type: integer }
                  musteriTurleri:
                    type: array
                    items: { $ref: "#/components/schemas/MusteriTuru" }
        "403": { $ref: "#/components/responses/YetkiYok" }

  /raporlar/bayi-fatura-ozet:
    get:
      tags: [Fatura]
      summary: Bayi / alt bayi fatura özet raporu (şartname s.2, s.9)
      description: Firma başına fatura gereken, yüklenen, bekleyen ve reddedilen işlem sayısı ile bekleyen tutar. Kapsam bayi özetiyle aynı; alt bayide yoktur (403).
      parameters:
        - { name: donem, in: query, schema: { type: string, enum: [7g, 30g, tumu], default: 30g } }
      responses:
        "200":
          description: Özet
          content:
            application/json:
              schema:
                type: object
                properties:
                  donem: { type: string }
                  kayitlar:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/FaturaOzetRakamlari"
                        - type: object
                          properties:
                            firma: { $ref: "#/components/schemas/FirmaOzeti" }
                            bagli: { oneOf: [{ $ref: "#/components/schemas/FirmaOzeti" }, { type: "null" }] }
                            durum: { $ref: "#/components/schemas/KayitDurumu" }
                  toplam:
                    allOf:
                      - $ref: "#/components/schemas/FaturaOzetRakamlari"
                      - type: object
                        properties:
                          firmaAdet: { type: integer }
        "403": { $ref: "#/components/responses/YetkiYok" }

  /faturalar:
    get:
      tags: [Fatura]
      summary: Fatura yükleme durumu (şartname s.9)
      description: |
        Fatura gereken işlemler: bayi / alt bayi çekimi, kendi kartı olmayan, başarılı. Kaydı olmayan işlem BEKLIYOR.
        Fatura içeriği yalnızca yükleyen firmaya döner; bayi ve ana firma `icerikGizli: true` görür.
      parameters:
        - { name: durum, in: query, schema: { type: string, enum: [YUKLENMEMIS, YUKLENEN, TUMU], default: YUKLENMEMIS } }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Liste"
                  - type: object
                    properties:
                      kayitlar: { type: array, items: { $ref: "#/components/schemas/FaturaSatiri" } }
                      ozet:
                        type: object
                        properties:
                          bekleyen: { type: integer }
                          bekleyenKurus: { $ref: "#/components/schemas/Kurus" }
                          yuklenen: { type: integer }
                          kendiBekleyen: { type: integer, description: Oturum firmasının kendi bekleyen faturaları }
    post:
      tags: [Fatura]
      summary: Fatura yükle (multipart/form-data)
      description: Şeklen kontrol sunucuda — fatura no 16 karakter, tarih işlem tarihinden önce değil, tutar işlem tutarına eşit, dosya PDF/JPG/PNG ve en çok 5 MB. Uygun olmayan fatura alınmaz (422, alan alan).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [islemNo, faturaNo, faturaTarihi, tutarKurus, dosya]
              properties:
                islemNo: { type: string }
                faturaNo: { type: string, pattern: "^[A-Z0-9]{3}\\d{13}$" }
                faturaTarihi: { type: string, format: date }
                tutarKurus: { type: integer }
                dosya: { type: string, format: binary }
      responses:
        "201":
          description: Fatura kaydı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fatura" }
        "404": { $ref: "#/components/responses/Bulunamadi" }
        "422": { $ref: "#/components/responses/IsKurali" }

  /faturalar/{islemNo}/hatirlatma:
    post:
      tags: [Fatura]
      summary: Çekimi yapan firmaya fatura hatırlatması gönder (e-posta)
      parameters:
        - { name: islemNo, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Gönderildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  gonderildi: { type: boolean }
                  firma: { $ref: "#/components/schemas/FirmaOzeti" }
                  kanal: { type: string, enum: [EPOSTA] }

  /faturalar/{islemNo}/yukleme-linki:
    post:
      tags: [Fatura]
      summary: Faturayı link üzerinden yükletmek için yükleme linki üret (şartname s.10)
      parameters:
        - { name: islemNo, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Link
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  sonGecerlilik: { type: string, format: date-time } · /tahsilat-carileri · /firma/ortaklar · /odeme/taksit-secenekleri · /odemeler · /odeme-linkleri
  # /iptal-iade-talepleri · /iptal-iade-talepleri/uygun-islemler · /iptal-iade-talepleri/{id}/onay · /{id}/red
  # /bayiler · /bayiler/{cariNo} · /alt-bayiler · /vade-farki-profilleri · /uye-isyerleri
  # /faturalar · /faturalar/{islemNo}/hatirlatma · /faturalar/{islemNo}/yukleme-linki

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  responses:
    OturumYok:
      description: Oturum yok ya da süresi dolmuş
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HataCevabi" }
          example: { hata: { kod: OTURUM_YOK, mesaj: Oturum bulunamadı. Yeniden giriş yapın. } }
    YetkiYok:
      description: Bu işlem için yetki yok
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HataCevabi" }
    Bulunamadi:
      description: Kayıt yok ya da kapsam dışında
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HataCevabi" }
    IsKurali:
      description: İş kuralı ihlali; alanlar form alanlarına eşlenir
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HataCevabi" }
          example: { hata: { kod: LIMIT_ASILDI, mesaj: İşlem bazlı ödeme limiti aşıldı., alanlar: { tutarKurus: "İşlem bazlı ödeme limiti ₺ 150.000." } } }

  schemas:
    HataCevabi:
      type: object
      required: [hata]
      properties:
        hata:
          type: object
          required: [kod, mesaj]
          properties:
            kod: { type: string, description: Makine tarafından okunur hata kodu, SABIT_BUYUK_HARF }
            mesaj: { type: string, description: Kullanıcıya gösterilebilir Türkçe mesaj }
            alanlar:
              type: object
              additionalProperties: { type: string }
              description: Alan adı → o alana ait mesaj

    Liste:
      type: object
      description: Sayfalı liste zarfı; kayitlar'ın öğe tipi uç noktaya göre değişir
      required: [kayitlar, toplam, sayfa, boyut]
      properties:
        kayitlar: { type: array, items: {} }
        toplam: { type: integer, description: Filtreye uyan toplam kayıt }
        sayfa: { type: integer, minimum: 1 }
        boyut: { type: integer, minimum: 1, maximum: 200 }
        sayaclar:
          type: object
          additionalProperties: { type: integer }
          description: Durum sekmelerinin sayıları; TUMU her zaman vardır

    Kurus:
      type: integer
      description: Kuruş cinsinden tutar (1240000 = ₺ 12.400,00)
      minimum: 0

    Rol:
      type: string
      enum: [ANA_FIRMA, BAYI, ALT_BAYI]

    Yetki:
      type: string
      enum: [YONETICI, ODEME, RAPORLAMA]
      description: Şartname s.3 — Yönetici tüm ekranlar; Ödeme ödeme + rapor; Raporlama yalnız rapor

    IslemDurumu:
      type: string
      enum: [BASARILI, BASARISIZ, IPTAL, IADE]

    MusteriTuru:
      type: string
      enum: [BAYI, ALT_BAYI, DUZENLI_MUSTERI, DUZENSIZ_MUSTERI, KENDI_KARTI, MUSTERI_KARTI]
      description: Şartname s.6 — rolün seçebildiği türler ekranda sınırlanır

    Islem:
      type: object
      required: [islemNo, tarih, cekimYapan, musteriTuru, musteri, kart, odemeTipi, taksit, tutarKurus, durum]
      properties:
        islemNo: { type: string, example: TRX-90241 }
        tarih: { type: string, format: date-time }
        cekimYapan: { $ref: "#/components/schemas/FirmaOzeti", description: Çekimi yapan firma }
        musteriTuru: { $ref: "#/components/schemas/MusteriTuru" }
        musteri:
          type: object
          required: [unvan, cariNo, vergiNo]
          properties:
            unvan: { type: string }
            cariNo: { type: string, example: "120.01.045" }
            vergiNo: { type: string, example: "4820193746" }
        kart:
          type: object
          required: [son4]
          properties:
            son4: { type: string, minLength: 4, maxLength: 4, description: Kart numarasının yalnızca son 4 hanesi }
        odemeTipi: { type: string, enum: [MANUEL, LINK] }
        taksit: { type: integer, minimum: 1, description: 1 = tek çekim }
        tutarKurus: { $ref: "#/components/schemas/Kurus" }
        durum: { $ref: "#/components/schemas/IslemDurumu" }

    KayitDurumu:
      type: string
      enum: [AKTIF, PASIF]

    DuyuruGirdisi:
      type: object
      required: [baslik, icerik, hedef, durum]
      properties:
        baslik: { type: string }
        icerik: { type: string }
        hedef:
          type: array
          minItems: 1
          items: { type: string, enum: [BAYI, ALT_BAYI] }
        durum: { type: string, enum: [YAYINDA, ARSIV] }

    Duyuru:
      allOf:
        - $ref: "#/components/schemas/DuyuruGirdisi"
        - type: object
          properties:
            duyuruId: { type: string, example: D-001 }
            tarih: { type: string, format: date }
            okundu: { type: boolean, description: Bayi / alt bayi cevabında; oturumdaki kullanıcı okudu mu }
            okunma:
              type: object
              description: Ana firma cevabında
              properties:
                hedefAdet: { type: integer, description: Hedef rollerdeki aktif kullanıcı }
                okuyanAdet: { type: integer }

    Kur:
      type: object
      properties:
        kod: { type: string, example: USD }
        ad: { type: string, example: Amerikan Doları }
        alis: { type: number, example: 34.12 }
        satis: { type: number, example: 34.28 }
        degisimYuzde: { type: number, example: 0.18, description: Önceki güne göre }

    BakiyeHareketi:
      type: object
      properties:
        hareketId: { type: string }
        tarih: { type: string, format: date-time }
        tur: { type: string, enum: [BORC, ODEME, IADE, IPTAL] }
        aciklama: { type: string }
        islemNo: { type: [string, "null"], description: Ödeme / iade kaynaklı hareketin işlemi }
        tutarKurus: { $ref: "#/components/schemas/Kurus", description: Borcu artıran hareket artı, ödeme eksi }

    KullaniciGirdisi:
      type: object
      required: [adSoyad, email, yetki, durum]
      properties:
        adSoyad: { type: string }
        email: { type: string, format: email, description: Ağda tek olmalı }
        telefon: { type: string }
        yetki: { $ref: "#/components/schemas/Yetki" }
        durum: { $ref: "#/components/schemas/KayitDurumu" }

    Kullanici:
      allOf:
        - $ref: "#/components/schemas/KullaniciGirdisi"
        - type: object
          properties:
            kullaniciId: { type: string, example: K-102 }
            kendisi: { type: boolean, description: Oturumdaki kullanıcının kendi kaydı }
            sonGiris: { type: [string, "null"], format: date-time }

    VadeFarkiProfiliGirdisi:
      type: object
      required: [ad, oranYuzde, durum]
      properties:
        ad: { type: string, example: Vade Farkı Profil 2, description: Ağda tek olmalı }
        oranYuzde: { type: number, minimum: 0, maximum: 10, example: 2.45, description: Aylık vade farkı oranı, en çok 2 ondalık }
        aciklama: { type: string }
        durum: { $ref: "#/components/schemas/KayitDurumu" }

    VadeFarkiProfili:
      allOf:
        - $ref: "#/components/schemas/VadeFarkiProfiliGirdisi"
        - type: object
          properties:
            id: { type: integer }
            kullananBayiSayisi: { type: integer, description: Bu profile bağlı aktif bayi / alt bayi sayısı }
            ornek:
              type: object
              description: Ekrandaki örnek hesap; formül sunucuda (bkz. /odeme/taksit-secenekleri)
              properties:
                tutarKurus: { $ref: "#/components/schemas/Kurus" }
                taksit: { type: integer, example: 6 }
                vadeFarkiKurus: { $ref: "#/components/schemas/Kurus" }

    KimlikGirdisi:
      type: object
      required: [unvan, cariNo, vergiNo, telefon, email, adres]
      properties:
        unvan: { type: string }
        cariNo: { type: string, pattern: "^\\d{3}\\.\\d{2}\\.\\d{3}$", description: Ağda tek olmalı }
        vergiNo: { type: string, pattern: "^\\d{10}$" }
        telefon: { type: string }
        email: { type: string, format: email }
        adres: { type: string }

    BayiGirdisi:
      allOf:
        - $ref: "#/components/schemas/KimlikGirdisi"
        - type: object
          required: [tur, vadeProfilId, taksitler, islemLimitiKurus, uyeIsyerleri, durum]
          properties:
            tur: { type: string, enum: [BAYI, ALT_BAYI], description: Ana firma BAYI, yetkili bayi ALT_BAYI tanımlar }
            vadeProfilId: { type: integer }
            taksitler:
              type: array
              items: { type: integer, minimum: 1, maximum: 12 }
              description: Görebileceği taksitler (1 = tek çekim); alt bayide tanımlayan bayinin taksitleri arasından
            islemLimitiKurus: { $ref: "#/components/schemas/Kurus" }
            altBayiYetkisi: { type: boolean, description: Yalnızca BAYI için }
            uyeIsyerleri:
              type: array
              items: { type: string }
              description: Göreceği ana firma üye işyerleri (cari no); alt bayide tanımlayan bayiye açık olanlar arasından
            durum: { $ref: "#/components/schemas/KayitDurumu" }

    Bayi:
      type: object
      description: Bayi, alt bayi ya da (GET /firma için) ana firma kaydı
      properties:
        firmaId: { type: string }
        tur: { $ref: "#/components/schemas/Rol" }
        unvan: { type: string }
        cariNo: { type: string }
        vergiNo: { type: string }
        telefon: { type: string }
        email: { type: string }
        adres: { type: string }
        vadeProfilId: { type: [integer, "null"] }
        vadeProfil:
          oneOf:
            - $ref: "#/components/schemas/VadeFarkiProfili"
            - type: "null"
        taksitler: { type: array, items: { type: integer } }
        islemLimitiKurus: { oneOf: [{ $ref: "#/components/schemas/Kurus" }, { type: "null" }] }
        altBayiYetkisi: { type: boolean, description: Yalnızca BAYI }
        altBayiSayisi: { type: integer, description: Yalnızca BAYI }
        bagli:
          oneOf:
            - $ref: "#/components/schemas/FirmaOzeti"
            - type: "null"
        uyeIsyerleri: { type: array, items: { type: string } }
        ortaklar: { type: array, items: { type: string }, description: Kendi kartı ödemesinde kart sahibi seçenekleri }
        logoRenk: { type: [string, "null"] }
        durum: { $ref: "#/components/schemas/KayitDurumu" }

    TaksitSecenegi:
      type: object
      properties:
        taksit: { type: integer, description: 1 = tek çekim }
        vadeFarkiKurus: { $ref: "#/components/schemas/Kurus" }
        toplamKurus: { $ref: "#/components/schemas/Kurus" }
        aylikKurus: { $ref: "#/components/schemas/Kurus" }

    MusteriGirdisi:
      type: object
      description: |
        BAYI / ALT_BAYI / DUZENLI_MUSTERI → yalnızca `cariNo`; DUZENSIZ_MUSTERI → unvan, kimlikNo (TCKN/VKN), telefon, email?;
        MUSTERI_KARTI → unvan, telefon, email?; KENDI_KARTI → gönderilmez, `kartSahibi` kullanılır.
      properties:
        cariNo: { type: string }
        unvan: { type: string }
        kimlikNo: { type: string, description: 10 haneli VKN ya da 11 haneli TCKN }
        telefon: { type: string }
        email: { type: string }

    OdemeGirdisi:
      type: object
      required: [musteriTuru, tahsilatCariNo, tutarKurus, taksit, kart]
      properties:
        musteriTuru: { $ref: "#/components/schemas/MusteriTuru" }
        musteri: { $ref: "#/components/schemas/MusteriGirdisi" }
        kartSahibi: { type: string, description: KENDI_KARTI için firma unvanı ya da ortak adı }
        tahsilatCariNo: { type: string }
        tutarKurus: { $ref: "#/components/schemas/Kurus" }
        taksit: { type: integer, minimum: 1 }
        aciklama: { type: string }
        kart:
          type: object
          required: [token, son4, isim]
          properties:
            token: { type: string, description: Ödeme sağlayıcısının kart tokenı — kart numarası asla gönderilmez }
            son4: { type: string }
            isim: { type: string, description: Kart üzerindeki isim }
        faturaBeyani: { type: boolean, description: Müşteri kartında zorunlu (şartname s.9) }

    OdemeSonucu:
      allOf:
        - $ref: "#/components/schemas/Islem"
        - type: object
          properties:
            kart:
              type: object
              properties:
                son4: { type: string }
                isim: { type: string }
            tahsilatCarisi:
              type: object
              properties:
                cariNo: { type: string }
                ad: { type: string }
            vadeFarkiKurus: { $ref: "#/components/schemas/Kurus" }
            toplamKurus: { $ref: "#/components/schemas/Kurus" }
            aylikKurus: { $ref: "#/components/schemas/Kurus" }
            vadeProfil: { $ref: "#/components/schemas/VadeFarkiProfili" }
            faturaGerekli: { type: boolean, description: Kendi kartı olmayan bayi / alt bayi işlemi — fatura yüklenmeli }
            redNedeni: { type: [string, "null"], description: BASARISIZ ise bankanın red nedeni }

    OdemeLinkiGirdisi:
      type: object
      required: [musteriTuru, tahsilatCariNo, tutarKurus, taksitler, kanal, gecerlilikGun]
      properties:
        musteriTuru: { $ref: "#/components/schemas/MusteriTuru" }
        musteri: { $ref: "#/components/schemas/MusteriGirdisi" }
        kartSahibi: { type: string }
        tahsilatCariNo: { type: string }
        tutarKurus: { $ref: "#/components/schemas/Kurus" }
        taksitler: { type: array, items: { type: integer }, description: Müşteriye gösterilecek taksitler }
        kanal: { type: string, enum: [SMS, EPOSTA, LINK] }
        hedef: { type: string, description: SMS için telefon, EPOSTA için e-posta }
        gecerlilikGun: { type: integer, enum: [1, 3, 7, 30] }
        aciklama: { type: string }
        faturaBeyani: { type: boolean }

    OdemeLinki:
      type: object
      properties:
        linkNo: { type: string, example: LNK-7Q2M4X }
        url: { type: string, format: uri }
        olusturma: { type: string, format: date-time }
        sonGecerlilik: { type: string, format: date-time }
        olusturan: { $ref: "#/components/schemas/FirmaOzeti" }
        musteriTuru: { $ref: "#/components/schemas/MusteriTuru" }
        musteriUnvan: { type: string }
        tutarKurus: { $ref: "#/components/schemas/Kurus" }
        kanal: { type: string, enum: [SMS, EPOSTA, LINK] }
        hedef: { type: [string, "null"] }
        taksitler: { type: [array, "null"], items: { type: integer } }
        tahsilatCarisi: { type: [object, "null"] }
        durum: { type: string, enum: [BEKLIYOR, ODENDI, SURESI_DOLDU, IPTAL_EDILDI] }

    OzetRakamlari:
      type: object
      properties:
        islemAdet: { type: integer }
        basariliAdet: { type: integer }
        basarisizAdet: { type: integer }
        ciroKurus: { $ref: "#/components/schemas/Kurus", description: Başarılı işlemlerin toplamı }
        vadeFarkiKurus: { $ref: "#/components/schemas/Kurus" }
        iptalIadeKurus: { $ref: "#/components/schemas/Kurus" }
        hesabaGececekKurus: { $ref: "#/components/schemas/Kurus" }

    FaturaOzetRakamlari:
      type: object
      properties:
        gereken: { type: integer, description: Fatura gereken işlem (bayi / alt bayi çekimi, kendi kartı olmayan, başarılı) }
        yuklenen: { type: integer }
        bekleyen: { type: integer }
        reddedilen: { type: integer }
        bekleyenKurus: { $ref: "#/components/schemas/Kurus", description: Yüklenmemiş + reddedilmiş işlemlerin tutarı }

    BayiOzetSatiri:
      allOf:
        - $ref: "#/components/schemas/OzetRakamlari"
        - type: object
          properties:
            firma: { $ref: "#/components/schemas/FirmaOzeti" }
            bagli:
              oneOf:
                - $ref: "#/components/schemas/FirmaOzeti"
                - type: "null"
            vadeProfil: { type: [string, "null"], example: Profil 2 }
            durum: { $ref: "#/components/schemas/KayitDurumu" }

    Talep:
      type: object
      properties:
        talepNo: { type: string, example: TLP-4418 }
        tarih: { type: string, format: date-time }
        islemNo: { type: string }
        giren: { $ref: "#/components/schemas/FirmaOzeti" }
        musteriUnvan: { type: string }
        islemTutariKurus: { $ref: "#/components/schemas/Kurus" }
        tutarKurus: { $ref: "#/components/schemas/Kurus" }
        tur: { type: string, enum: [IADE, IPTAL] }
        aciklama: { type: string }
        durum: { type: string, enum: [BAYI_ONAYINDA, ANA_FIRMA_ONAYINDA, ONAYLANDI, REDDEDILDI] }
        onayimda: { type: boolean, description: Oturum bu talebe onay / red verebilir }
        gecmis:
          type: array
          items:
            type: object
            properties:
              tarih: { type: string, format: date-time }
              firma: { $ref: "#/components/schemas/FirmaOzeti" }
              olay: { type: string, enum: [TALEP_GIRILDI, ONAYLADI_ILETTI, ONAYLADI, REDDETTI] }
              not: { type: [string, "null"], description: Red gerekçesi vb. }

    Fatura:
      type: object
      description: Yükleyen firma tüm alanları görür; diğerleri yalnızca durum + icerikGizli
      properties:
        durum: { type: string, enum: [YUKLENDI, REDDEDILDI] }
        yukleme: { type: string, format: date-time }
        redNedeni: { type: [string, "null"] }
        faturaNo: { type: string }
        faturaTarihi: { type: string, format: date }
        tutarKurus: { $ref: "#/components/schemas/Kurus" }
        dosyaAdi: { type: string }
        icerikGizli: { type: boolean }

    FaturaSatiri:
      type: object
      properties:
        islem: { $ref: "#/components/schemas/Islem" }
        fatura:
          oneOf:
            - $ref: "#/components/schemas/Fatura"
            - type: "null"
        durum: { type: string, enum: [BEKLIYOR, YUKLENDI, REDDEDILDI] }
        kendi: { type: boolean, description: İşlemi oturum firması yaptı (yükleyebilir) }

    Musteri:
      type: object
      properties:
        musteriId: { type: string }
        unvan: { type: string }
        cariNo: { type: string }
        vergiNo: { type: string }
        telefon: { type: string }
        email: { type: string }
        adres: { type: [string, "null"] }
        durum: { $ref: "#/components/schemas/KayitDurumu" }

    FirmaOzeti:
      type: object
      required: [firmaId, unvan, tur]
      properties:
        firmaId: { type: string, description: Firma kimliği (örnek veride cari no) }
        unvan: { type: string }
        tur: { $ref: "#/components/schemas/Rol" }

    Oturum:
      type: object
      required: [kullanici, rol, firma, anaFirma, yetkiler]
      properties:
        kullanici:
          type: object
          required: [kullaniciId, adSoyad, email, yetki]
          properties:
            kullaniciId: { type: string }
            adSoyad: { type: string }
            email: { type: string, format: email }
            yetki: { $ref: "#/components/schemas/Yetki" }
        rol: { $ref: "#/components/schemas/Rol" }
        firma:
          allOf:
            - $ref: "#/components/schemas/FirmaOzeti"
            - type: object
              properties:
                cariNo: { type: string }
                vergiNo: { type: string }
                logoRenk: { type: [string, "null"], description: Logo yoksa baş harf kutusunun rengi }
                bagli:
                  oneOf:
                    - $ref: "#/components/schemas/FirmaOzeti"
                    - type: "null"
                  description: Bağlı olunan üst firma (bayi → ana firma, alt bayi → bayi)
        anaFirma:
          type: object
          description: Ağın ana firması; şartname s.1 gereği her rolde logo + adıyla görünür
          properties:
            firmaId: { type: string }
            unvan: { type: string }
            kisaAd: { type: string }
            aciklama: { type: string }
            logoRenk: { type: [string, "null"] }
        yetkiler:
          type: array
          items:
            type: string
            enum: [ODEME, RAPOR, IPTAL_IADE_GIRIS, IPTAL_IADE_ONAY, BAYI_TANIM, KULLANICI_TANIM, AYARLAR]
