openapi: 3.1.0
info:
  title: N Kolay Bayim B2B Panel API
  version: 0.1.0
  description: |
    Panel ekranlarının kullandığı uç noktalar. Ekranlar bu sözleşmeye göre yazılmıştır; sahte backend (mocks/)
    aynı sözleşmeye göre cevap verir. Backend servisleri bu dosyaya göre yazılınca ekran kodu değişmeden bağlanır.

    Genel kurallar
    - Alan adları camelCase; durum ve tür değerleri kod (ör. BASARILI, ALT_BAYI). Ekran etiketleri: lib/etiketler.js
    - Para: kuruş cinsinden tam sayı (tutarKurus: 1240000 = ₺ 12.400,00)
    - Tarih: ISO 8601, saat dilimli (2026-09-30T14:22:00+03:00); yalnız gün için YYYY-AA-GG
    - Liste cevabı: { kayitlar, toplam, sayfa, boyut, sayaclar? }; filtre ve arama sorgu parametresiyle, sunucuda
    - Hata: { hata: { kod, mesaj, alanlar? } } + HTTP durumu (400 biçim, 401 oturum yok, 403 yetki yok,
      404 yok, 409 çakışma, 422 iş kuralı, 500 sunucu)
    - Kimlik: Authorization: Bearer <token>; rol ve firma tokendan çıkarılır, istemci göndermez
    - Rol kapsamı (şartname s.7): ana firma tüm ağı, bayi kendisi + alt bayileri, alt bayi yalnızca kendisi görür.
      Kapsam dışı kayıt listelerde yer almaz, tekil istekte 404 döner.

    Backend ekibinin netleştireceği noktalar
    - Kimlik doğrulama: token nasıl alınır, klasik panelle ortak oturum (şartname s.10)
    - Ödeme: kart numarası yerine kart tokenı (PCI); tokenı hangi sağlayıcı / 3D Secure akışı üretir
    - Vade farkı formülü: sunucu /odeme/taksit-secenekleri ile hesaplar; mockup varsayımı tutar × oran × (taksit − 1)
servers:
  - url: /api/v1
    description: Sahte backend (MSW) — geliştirme ve demo
security:
  - bearer: []
tags:
  - name: Oturum
  - name: Panel
  - name: İşlemler
  - name: Ödeme
  - name: İptal / İade
  - name: Bayi Tanım
  - name: Fatura
  - name: Tanımlar

paths:
  /oturum:
    get:
      tags: [Oturum]
      summary: Giriş yapmış kullanıcı, rolü, firması ve yetkileri
      responses:
        "200":
          description: Oturum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Oturum" }
              example:
                kullanici: { kullaniciId: K-101, adSoyad: Murat Aydın, email: murat@ankaralastik.com, yetki: YONETICI }
                rol: BAYI
                firma:
                  firmaId: "320.01.001"
                  unvan: Ankara Lastik Bayi Ltd.
                  tur: BAYI
                  cariNo: "320.01.001"
                  vergiNo: "1234567890"
                  logoRenk: "#C2630F"
                  bagli: { firmaId: "100.00.001", unvan: Brisa A.Ş., tur: ANA_FIRMA }
                anaFirma: { firmaId: "100.00.001", unvan: Brisa A.Ş., kisaAd: Brisa, aciklama: Lastik & Otomotiv Bayi Ağı, logoRenk: "#4F9B7C" }
                yetkiler: [ODEME, RAPOR, IPTAL_IADE_GIRIS, IPTAL_IADE_ONAY, BAYI_TANIM, KULLANICI_TANIM, AYARLAR]
        "401": { $ref: "#/components/responses/OturumYok" }

  /islemler:
    get:
      tags: [İşlemler]
      summary: İşlem listesi (rapor ve Son İşlemler)
      description: |
        Rol kapsamındaki ödeme işlemleri, en yeniden eskiye. Filtre, arama ve sayfalama sunucuda.
        `sayaclar` durum sekmelerinin sayılarıdır ve durum dışındaki filtrelere göre hesaplanır;
        `ozet` filtreye uyan tüm kayıtların (sayfadan bağımsız) toplamıdır.
      parameters:
        - { name: durum, in: query, schema: { $ref: "#/components/schemas/IslemDurumu" } }
        - { name: musteriTuru, in: query, schema: { $ref: "#/components/schemas/MusteriTuru" } }
        - { name: odemeTipi, in: query, schema: { type: string, enum: [MANUEL, LINK] } }
        - { name: q, in: query, schema: { type: string }, description: İşlem no, unvan, cari no, vergi no, kart son 4 hane, çekim yapan unvanı }
        - { name: sayfa, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: boyut, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Sayfalı işlem listesi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Liste"
                  - type: object
                    required: [sayaclar, ozet, musteriTurleri]
                    properties:
                      kayitlar: { type: array, items: { $ref: "#/components/schemas/Islem" } }
                      ozet:
                        type: object
                        properties:
                          toplamKurus: { $ref: "#/components/schemas/Kurus" }
                          basariliKurus: { $ref: "#/components/schemas/Kurus" }
                      musteriTurleri:
                        type: array
                        items: { $ref: "#/components/schemas/MusteriTuru" }
                        description: Kapsamda görülen müşteri türleri (filtre seçenekleri)
              example:
                kayitlar:
                  - islemNo: TRX-90241
                    tarih: "2026-09-30T14:22:00+03:00"
                    cekimYapan: { firmaId: "320.01.001", unvan: Ankara Lastik Bayi Ltd., tur: BAYI }
                    musteriTuru: DUZENLI_MUSTERI
                    musteri: { unvan: Yılmaz Otomotiv, cariNo: "120.01.045", vergiNo: "4820193746" }
                    kart: { son4: "4821" }
                    odemeTipi: MANUEL
                    taksit: 3
                    tutarKurus: 1240000
                    durum: BASARILI
                toplam: 14
                sayfa: 1
                boyut: 50
                sayaclar: { TUMU: 22, BASARILI: 14, BASARISIZ: 3, IPTAL: 3, IADE: 2 }
                ozet: { toplamKurus: 24587000, basariliKurus: 21000000 }
                musteriTurleri: [BAYI, ALT_BAYI, DUZENLI_MUSTERI, DUZENSIZ_MUSTERI, KENDI_KARTI]
        "401": { $ref: "#/components/responses/OturumYok" }

  /panel/ozet:
    get:
      tags: [Panel]
      summary: Ana Sayfa KPI özeti
      description: Kalem başına adet, tutar ve düne göre değişim; başarı oranı; ortalama işlem; mini seriler. Rol kapsamına göre hesaplanır.
      parameters:
        - { name: donem, in: query, schema: { type: string, enum: [bugun, hafta, ay], default: bugun } }
      responses:
        "200":
          description: KPI özeti
          content:
            application/json:
              schema:
                type: object
                required: [donem, kalemler, basariOraniYuzde, ortalamaIslemKurus]
                properties:
                  donem: { type: string }
                  kalemler:
                    type: object
                    description: TOPLAM, BASARILI, BASARISIZ, IPTAL, IADE anahtarları
                    additionalProperties:
                      type: object
                      properties:
                        adet: { type: integer }
                        tutarKurus: { $ref: "#/components/schemas/Kurus" }
                        degisimYuzde: { type: number, description: Düne göre yüzde değişim, işaretli }
                  basariOraniYuzde: { type: number }
                  ortalamaIslemKurus: { $ref: "#/components/schemas/Kurus" }
                  seriler:
                    type: object
                    description: Kart içi mini grafik için 7 noktalı seriler (TOPLAM, BASARILI); birimsiz
                    additionalProperties: { type: array, items: { type: number } }
              example:
                donem: bugun
                kalemler:
                  TOPLAM: { adet: 1284, tutarKurus: 428490000, degisimYuzde: 6.4 }
                  BASARILI: { adet: 1180, tutarKurus: 396010000, degisimYuzde: 7.1 }
                  BASARISIZ: { adet: 74, tutarKurus: 21040000, degisimYuzde: -2.3 }
                  IPTAL: { adet: 18, tutarKurus: 6420000, degisimYuzde: 0.8 }
                  IADE: { adet: 12, tutarKurus: 5020000, degisimYuzde: -1.2 }
                basariOraniYuzde: 91.9
                ortalamaIslemKurus: 333715
                seriler: { TOPLAM: [44, 50, 49, 57, 61, 66, 72], BASARILI: [40, 52, 47, 60, 58, 71, 76] }
        "401": { $ref: "#/components/responses/OturumYok" }

  /panel/haftalik-hacim:
    get:
      tags: [Panel]
      summary: Son 7 günün günlük işlem hacmi
      responses:
        "200":
          description: Günlük hacim
          content:
            application/json:
              schema:
                type: object
                required: [gunler, toplamKurus, degisimYuzde]
                properties:
                  gunler:
                    type: array
                    items:
                      type: object
                      properties:
                        gun: { type: string, format: date }
                        tutarKurus: { $ref: "#/components/schemas/Kurus" }
                  toplamKurus: { $ref: "#/components/schemas/Kurus" }
                  degisimYuzde: { type: number, description: Geçen haftaya göre, işaretli }
              example:
                gunler: [{ gun: "2026-09-28", tutarKurus: 51200000 }, { gun: "2026-09-29", tutarKurus: 64400000 }]
                toplamKurus: 374000000
                degisimYuzde: 12.4
        "401": { $ref: "#/components/responses/OturumYok" }

  /panel/bakiye:
    get:
      tags: [Panel]
      summary: Bakiye ve borç
      description: Ana firma kendi limitini, bayi ana firma carisini, alt bayi bayi carisini görür (şartname s.2).
      responses:
        "200":
          description: Bakiye
          content:
            application/json:
              schema:
                type: object
                required: [bakiyeKurus, borcKurus, limitKurus, kullanimYuzde, gorunum]
                properties:
                  bakiyeKurus: { $ref: "#/components/schemas/Kurus" }
                  borcKurus: { $ref: "#/components/schemas/Kurus" }
                  limitKurus: { $ref: "#/components/schemas/Kurus" }
                  kullanimYuzde: { type: number }
                  gorunum: { type: string, enum: [FIRMA_LIMITI, UST_CARI] }
              example: { bakiyeKurus: 18420000, borcKurus: 4650000, limitKurus: 40000000, kullanimYuzde: 46, gorunum: UST_CARI }
        "401": { $ref: "#/components/responses/OturumYok" }

  # --- Sonraki adımlarda eklenecek uç noktalar (docs/api/README.md'deki tablo) ---
  # /panel/bekleyenler (menü rozetleri — iptal/iade ve fatura ekranları API'ye geçince)
  # /musteriler · /tahsilat-carileri · /firma/ortaklar · /odeme/taksit-secenekleri · /odemeler · /odeme-linkleri
  # /iptal-iade-talepleri · /iptal-iade-talepleri/uygun-islemler · /iptal-iade-talepleri/{id}/onay · /{id}/red
  # /bayiler · /bayiler/{cariNo} · /alt-bayiler · /vade-farki-profilleri · /uye-isyerleri
  # /faturalar · /faturalar/{islemNo}/hatirlatma · /faturalar/{islemNo}/yukleme-linki

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  responses:
    OturumYok:
      description: Oturum yok ya da süresi dolmuş
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HataCevabi" }
          example: { hata: { kod: OTURUM_YOK, mesaj: Oturum bulunamadı. Yeniden giriş yapın. } }
    YetkiYok:
      description: Bu işlem için yetki yok
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HataCevabi" }
    Bulunamadi:
      description: Kayıt yok ya da kapsam dışında
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HataCevabi" }
    IsKurali:
      description: İş kuralı ihlali; alanlar form alanlarına eşlenir
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HataCevabi" }
          example: { hata: { kod: LIMIT_ASILDI, mesaj: İşlem bazlı ödeme limiti aşıldı., alanlar: { tutarKurus: "İşlem bazlı ödeme limiti ₺ 150.000." } } }

  schemas:
    HataCevabi:
      type: object
      required: [hata]
      properties:
        hata:
          type: object
          required: [kod, mesaj]
          properties:
            kod: { type: string, description: Makine tarafından okunur hata kodu, SABIT_BUYUK_HARF }
            mesaj: { type: string, description: Kullanıcıya gösterilebilir Türkçe mesaj }
            alanlar:
              type: object
              additionalProperties: { type: string }
              description: Alan adı → o alana ait mesaj

    Liste:
      type: object
      description: Sayfalı liste zarfı; kayitlar'ın öğe tipi uç noktaya göre değişir
      required: [kayitlar, toplam, sayfa, boyut]
      properties:
        kayitlar: { type: array, items: {} }
        toplam: { type: integer, description: Filtreye uyan toplam kayıt }
        sayfa: { type: integer, minimum: 1 }
        boyut: { type: integer, minimum: 1, maximum: 200 }
        sayaclar:
          type: object
          additionalProperties: { type: integer }
          description: Durum sekmelerinin sayıları; TUMU her zaman vardır

    Kurus:
      type: integer
      description: Kuruş cinsinden tutar (1240000 = ₺ 12.400,00)
      minimum: 0

    Rol:
      type: string
      enum: [ANA_FIRMA, BAYI, ALT_BAYI]

    Yetki:
      type: string
      enum: [YONETICI, ODEME, RAPORLAMA]
      description: Şartname s.3 — Yönetici tüm ekranlar; Ödeme ödeme + rapor; Raporlama yalnız rapor

    IslemDurumu:
      type: string
      enum: [BASARILI, BASARISIZ, IPTAL, IADE]

    MusteriTuru:
      type: string
      enum: [BAYI, ALT_BAYI, DUZENLI_MUSTERI, DUZENSIZ_MUSTERI, KENDI_KARTI, MUSTERI_KARTI]
      description: Şartname s.6 — rolün seçebildiği türler ekranda sınırlanır

    Islem:
      type: object
      required: [islemNo, tarih, cekimYapan, musteriTuru, musteri, kart, odemeTipi, taksit, tutarKurus, durum]
      properties:
        islemNo: { type: string, example: TRX-90241 }
        tarih: { type: string, format: date-time }
        cekimYapan: { $ref: "#/components/schemas/FirmaOzeti", description: Çekimi yapan firma }
        musteriTuru: { $ref: "#/components/schemas/MusteriTuru" }
        musteri:
          type: object
          required: [unvan, cariNo, vergiNo]
          properties:
            unvan: { type: string }
            cariNo: { type: string, example: "120.01.045" }
            vergiNo: { type: string, example: "4820193746" }
        kart:
          type: object
          required: [son4]
          properties:
            son4: { type: string, minLength: 4, maxLength: 4, description: Kart numarasının yalnızca son 4 hanesi }
        odemeTipi: { type: string, enum: [MANUEL, LINK] }
        taksit: { type: integer, minimum: 1, description: 1 = tek çekim }
        tutarKurus: { $ref: "#/components/schemas/Kurus" }
        durum: { $ref: "#/components/schemas/IslemDurumu" }

    FirmaOzeti:
      type: object
      required: [firmaId, unvan, tur]
      properties:
        firmaId: { type: string, description: Firma kimliği (örnek veride cari no) }
        unvan: { type: string }
        tur: { $ref: "#/components/schemas/Rol" }

    Oturum:
      type: object
      required: [kullanici, rol, firma, anaFirma, yetkiler]
      properties:
        kullanici:
          type: object
          required: [kullaniciId, adSoyad, email, yetki]
          properties:
            kullaniciId: { type: string }
            adSoyad: { type: string }
            email: { type: string, format: email }
            yetki: { $ref: "#/components/schemas/Yetki" }
        rol: { $ref: "#/components/schemas/Rol" }
        firma:
          allOf:
            - $ref: "#/components/schemas/FirmaOzeti"
            - type: object
              properties:
                cariNo: { type: string }
                vergiNo: { type: string }
                logoRenk: { type: [string, "null"], description: Logo yoksa baş harf kutusunun rengi }
                bagli:
                  oneOf:
                    - $ref: "#/components/schemas/FirmaOzeti"
                    - type: "null"
                  description: Bağlı olunan üst firma (bayi → ana firma, alt bayi → bayi)
        anaFirma:
          type: object
          description: Ağın ana firması; şartname s.1 gereği her rolde logo + adıyla görünür
          properties:
            firmaId: { type: string }
            unvan: { type: string }
            kisaAd: { type: string }
            aciklama: { type: string }
            logoRenk: { type: [string, "null"] }
        yetkiler:
          type: array
          items:
            type: string
            enum: [ODEME, RAPOR, IPTAL_IADE_GIRIS, IPTAL_IADE_ONAY, BAYI_TANIM, KULLANICI_TANIM, AYARLAR]
